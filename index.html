<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker - Texas Hold'em</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="game-header">
        <div class="logo">
            <span>♠</span> Royal Texas Hold'em
        </div>
        <div class="header-stats">
            <div class="stat-item">Blinds: <span id="header-blinds">$10 / $20</span></div>
            <div class="stat-item">Hands Played: <span id="header-hands">0</span></div>
            <div class="stat-item">Your Bankroll: <span id="header-bankroll">$1,000</span></div>
        </div>
        <div class="header-actions">
            <button id="btn-toggle-log" class="btn-header">📜 History</button>
            <button id="btn-rebuy" class="btn-header">💰 Re-buy ($1000)</button>
            <button id="btn-new-hand" class="btn-header" style="background: var(--gold); color: #000; font-weight: bold;">Deal Next Hand</button>
        </div>
    </header>

    <!-- Main Game Arena -->
    <main class="game-arena">
        
        <!-- Poker Table Container -->
        <div class="table-container">
            <div class="poker-table">
                <div class="table-felt-inner-line"></div>

                <!-- Dealer Button Element (Positioned dynamically) -->
                <div id="dealer-btn" class="dealer-button">D</div>

                <!-- SEAT 1: Top (Alex) -->
                <div class="seat seat-top" id="seat-1">
                    <div class="hole-cards" id="cards-1"></div>
                    <div class="player-badge">
                        <div class="player-avatar">🦊</div>
                        <div class="player-details">
                            <span class="player-name">Alex</span>
                            <span class="player-chips" id="chips-1">$1000</span>
                        </div>
                        <div class="player-status-tag" id="status-1" style="display: none;"></div>
                    </div>
                    <div class="bet-chips" id="bet-1" style="display: none;">🪙 <span class="bet-val">0</span></div>
                </div>

                <!-- SEAT 2: Left (Claire) -->
                <div class="seat seat-left" id="seat-2">
                    <div class="hole-cards" id="cards-2"></div>
                    <div class="player-badge">
                        <div class="player-avatar">🦉</div>
                        <div class="player-details">
                            <span class="player-name">Claire</span>
                            <span class="player-chips" id="chips-2">$1000</span>
                        </div>
                        <div class="player-status-tag" id="status-2" style="display: none;"></div>
                    </div>
                    <div class="bet-chips" id="bet-2" style="display: none;">🪙 <span class="bet-val">0</span></div>
                </div>

                <!-- CENTER: Pot & Community Cards -->
                <div class="table-center">
                    <div class="pot-display">
                        <span class="pot-chips">🪙</span>
                        <span>POT: <span id="table-pot">$0</span></span>
                    </div>

                    <div class="community-cards-container" id="community-cards">
                        <div class="community-card-slot"></div>
                        <div class="community-card-slot"></div>
                        <div class="community-card-slot"></div>
                        <div class="community-card-slot"></div>
                        <div class="community-card-slot"></div>
                    </div>

                    <div class="dealer-announcement" id="dealer-announcement">
                        Click "Deal Next Hand" to begin!
                    </div>
                </div>

                <!-- SEAT 3: Right (Tom) -->
                <div class="seat seat-right" id="seat-3">
                    <div class="hole-cards" id="cards-3"></div>
                    <div class="player-badge">
                        <div class="player-avatar">🐺</div>
                        <div class="player-details">
                            <span class="player-name">Tom</span>
                            <span class="player-chips" id="chips-3">$1000</span>
                        </div>
                        <div class="player-status-tag" id="status-3" style="display: none;"></div>
                    </div>
                    <div class="bet-chips" id="bet-3" style="display: none;">🪙 <span class="bet-val">0</span></div>
                </div>

                <!-- SEAT 0: Bottom (Human / You) -->
                <div class="seat seat-bottom" id="seat-0">
                    <div class="bet-chips" id="bet-0" style="display: none;">🪙 <span class="bet-val">0</span></div>
                    <div class="hole-cards" id="cards-0"></div>
                    <div class="player-badge">
                        <div class="player-avatar">👤</div>
                        <div class="player-details">
                            <span class="player-name">You</span>
                            <span class="player-chips" id="chips-0">$1000</span>
                        </div>
                        <div class="player-status-tag" id="status-0" style="display: none;"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- History / Log Drawer -->
        <aside class="history-drawer" id="history-drawer">
            <div class="drawer-header">
                <span>Hand History</span>
                <button id="btn-close-log" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
            </div>
            <div class="log-list" id="log-list">
                <!-- Log entries will appear here -->
            </div>
        </aside>

    </main>

    <!-- Bottom User Action Bar -->
    <footer class="action-bar">
        <div class="hand-strength-preview">
            <span class="hand-strength-label">Your Best Hand</span>
            <span class="hand-strength-value" id="user-hand-name">—</span>
        </div>

        <div class="action-buttons-group">
            <button id="btn-fold" class="action-btn btn-fold" disabled>Fold</button>
            <button id="btn-check-call" class="action-btn btn-check-call" disabled>Check</button>

            <div class="raise-controls">
                <div class="raise-presets">
                    <button class="btn-preset" data-preset="min">Min</button>
                    <button class="btn-preset" data-preset="half-pot">1/2 Pot</button>
                    <button class="btn-preset" data-preset="pot">Pot</button>
                    <button class="btn-preset" data-preset="all-in">All-In</button>
                </div>
                <div class="raise-inputs">
                    <input type="range" id="raise-slider" class="raise-slider" min="20" max="1000" step="10" value="40" disabled>
                    <button id="btn-raise" class="action-btn btn-raise" disabled>Raise to $40</button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Result / Winner Modal -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="modal-title">Hand Complete</h2>
            <div class="modal-body" id="modal-body">Winner announcement</div>
            <div class="modal-actions">
                <button class="btn-primary" id="btn-modal-next">Next Hand</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/evaluator.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
